<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0c1b">
  <title>Me contacter | Kyllian Chouquet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            premium: {
              bg: '#0f0c1b',
              surface: '#181428',
              card: '#221c38',
              border: '#362d59',
              violet: '#a855f7',
              textMain: '#f3e8ff',
              textMuted: '#c4b5fd'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-premium-bg text-premium-textMain font-sans antialiased selection:bg-premium-violet selection:text-white">
  <main class="min-h-screen flex flex-col items-center justify-center px-5 py-10">
    <section aria-labelledby="contact-title" class="w-full max-w-xl rounded-2xl border border-premium-border bg-premium-surface p-6 shadow-2xl sm:p-8">
      <h1 id="contact-title" class="text-xl font-bold text-white sm:text-2xl">Me contacter</h1>
      <div class="mt-5 flex flex-col gap-3 sm:flex-row">
        <p id="contact-email" class="flex min-h-12 flex-1 items-center break-all rounded-xl border border-premium-border bg-premium-card px-4 py-3 text-sm text-premium-textMain sm:text-base">
          kyllian.chouquetpro@gmail.com
        </p>
        <button type="button" aria-describedby="copy-status" class="inline-flex min-h-12 items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 px-5 py-3 text-sm font-semibold text-white shadow-md transition-all hover:from-purple-500 hover:to-indigo-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-purple-300 focus-visible:ring-offset-2 focus-visible:ring-offset-premium-surface" onclick="copyEmail()">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="8" y="8" width="13" height="13" rx="2"></rect>
            <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"></path>
          </svg>
          Copier l’adresse
        </button>
      </div>
      <p id="copy-status" role="status" aria-live="polite" class="mt-3 min-h-5 text-sm text-premium-textMuted"></p>
    </section>
    <a href="index.html" class="mt-6 rounded text-sm text-premium-textMuted underline decoration-premium-border underline-offset-4 transition-colors hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-purple-400">
      Retour au portfolio
    </a>
  </main>
  <script>
    async function copyEmail() {
      const email = document.getElementById('contact-email').textContent.trim();
      const status = document.getElementById('copy-status');

      try {
        await navigator.clipboard.writeText(email);
        status.textContent = 'Adresse e-mail copiée.';
      } catch (error) {
        status.textContent = 'La copie automatique a échoué. Sélectionnez l’adresse pour la copier manuellement.';
      }
    }
  </script>
</body>
</html>
